<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>V Pay 서비스 지역</title>
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>
  :root{
    --paper:#F5F5F7; --ink:#111113; --mut:#6E6E73; --acc:#F97316;
    --land:#E6E3DE; --landline:#D8D4CE; --live:#F97316; --soon:#9A9AA0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--paper);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;
    color:var(--ink);overflow:hidden;word-break:keep-all;
  }
  #wrap{position:relative;width:100%;height:100%}
  svg{display:block;width:100%;height:100%}
  .country{fill:var(--land);stroke:var(--landline);stroke-width:.5}
  .country.on{fill:#EFE4DA;stroke:#E3CBB4}
  .corridor{fill:none;stroke:var(--live);stroke-width:1.6;stroke-linecap:round;opacity:.9}
  .corridor.soon{stroke:var(--soon);stroke-width:1.2;stroke-dasharray:5 6;opacity:.75}
  .flow{fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:0 260;
        animation:flow 3.4s linear infinite;mix-blend-mode:normal;opacity:.95}
  .flow.d1{animation-delay:.4s}.flow.d2{animation-delay:1.1s}.flow.d3{animation-delay:1.8s}
  @keyframes flow{
    0%{stroke-dasharray:0 6 0 254;opacity:0}
    8%{opacity:.95}
    92%{opacity:.95}
    100%{stroke-dasharray:0 254 6 0;opacity:0}
  }
  .hub{fill:var(--acc)}
  .hub-ring{fill:none;stroke:var(--acc);stroke-width:1.2;opacity:.5;animation:ping 2.6s ease-out infinite}
  @keyframes ping{0%{r:5;opacity:.55}100%{r:22;opacity:0}}
  .node{fill:#fff;stroke:var(--live);stroke-width:2}
  .node.soon{stroke:var(--soon)}
  .label{font-size:11px;font-weight:600;letter-spacing:-.01em;fill:var(--ink)}
  .sub{font-size:9.5px;font-weight:500;fill:var(--mut)}
  #legend{position:absolute;left:16px;bottom:14px;display:flex;gap:16px;align-items:center;font-size:11px;color:var(--mut)}
  #legend b{display:inline-block;width:18px;height:2px;background:var(--live);margin-right:6px;vertical-align:middle}
  #legend i{display:inline-block;width:18px;height:0;border-top:2px dashed var(--soon);margin-right:6px;vertical-align:middle}
  #note{position:absolute;right:16px;bottom:14px;font-size:10.5px;color:var(--mut);opacity:.8}
  @media (prefers-reduced-motion: reduce){
    .flow,.hub-ring{animation:none;display:none}
  }
</style>
</head>
<body>
<div id="wrap">
  <svg id="map" role="img" aria-label="한국에서 베트남·필리핀·태국·인도네시아로 이어지는 V Pay 송금 구간 지도"></svg>
  <div id="legend"><span><b></b>운영 구간</span><span><i></i>준비 구간</span></div>
  <div id="note">Natural Earth 지형 데이터</div>
</div>
<script>
const CITIES = {
  seoul:   { name: '서울', sub: 'Seoul · HUB', lon: 126.98, lat: 37.57 },
  hanoi:   { name: '하노이', sub: '계좌 · 현금', lon: 105.85, lat: 21.03, status: 'live' },
  manila:  { name: '마닐라', sub: '계좌 · 현금', lon: 120.98, lat: 14.60, status: 'live' },
  bangkok: { name: '방콕', sub: '계좌 · 준비', lon: 100.50, lat: 13.75, status: 'soon' },
  jakarta: { name: '자카르타', sub: '계좌 · 준비', lon: 106.85, lat: -6.21, status: 'soon' }
};
const ROUTES = ['hanoi', 'manila', 'bangkok', 'jakarta'];
const HIGHLIGHT = new Set(['South Korea', 'Vietnam', 'Philippines', 'Thailand', 'Indonesia']);
const REGION = { type: 'Polygon', coordinates: [[[94, -13], [94, 44], [144, 44], [144, -13], [94, -13]]] };

const svg = d3.select('#map');
let countries = null;

function arc(a, b, samples = 48) {
  const i = d3.geoInterpolate([a.lon, a.lat], [b.lon, b.lat]);
  return { type: 'LineString', coordinates: d3.range(samples + 1).map(k => i(k / samples)) };
}

function draw() {
  if (!countries) return;
  const el = document.getElementById('wrap');
  const w = el.clientWidth, h = el.clientHeight;
  if (!w || !h) return;
  svg.attr('viewBox', `0 0 ${w} ${h}`).selectAll('*').remove();

  const projection = d3.geoMercator().fitExtent([[18, 26], [w - 18, h - 44]], REGION);
  const path = d3.geoPath(projection);

  svg.append('g').selectAll('path')
    .data(countries)
    .join('path')
    .attr('class', d => 'country' + (HIGHLIGHT.has(d.properties.name) ? ' on' : ''))
    .attr('d', path);

  const routes = svg.append('g');
  ROUTES.forEach((key, idx) => {
    const city = CITIES[key];
    const line = arc(CITIES.seoul, city);
    routes.append('path')
      .attr('class', 'corridor' + (city.status === 'soon' ? ' soon' : ''))
      .attr('d', path(line));
    if (city.status === 'live') {
      routes.append('path')
        .attr('class', 'flow d' + idx)
        .attr('d', path(line));
    }
  });

  const nodes = svg.append('g');
  ROUTES.forEach(key => {
    const city = CITIES[key];
    const [x, y] = projection([city.lon, city.lat]);
    nodes.append('circle')
      .attr('class', 'node' + (city.status === 'soon' ? ' soon' : ''))
      .attr('cx', x).attr('cy', y).attr('r', 4.5);
    const flip = x > w - 96;
    nodes.append('text').attr('class', 'label')
      .attr('x', flip ? x - 11 : x + 11).attr('y', y - 1)
      .attr('text-anchor', flip ? 'end' : 'start')
      .text(city.name);
    nodes.append('text').attr('class', 'sub')
      .attr('x', flip ? x - 11 : x + 11).attr('y', y + 11)
      .attr('text-anchor', flip ? 'end' : 'start')
      .text(city.sub);
  });

  const [hx, hy] = projection([CITIES.seoul.lon, CITIES.seoul.lat]);
  nodes.append('circle').attr('class', 'hub-ring').attr('cx', hx).attr('cy', hy).attr('r', 5);
  nodes.append('circle').attr('class', 'hub').attr('cx', hx).attr('cy', hy).attr('r', 5.5);
  nodes.append('text').attr('class', 'label').attr('x', hx + 12).attr('y', hy - 1).text(CITIES.seoul.name);
  nodes.append('text').attr('class', 'sub').attr('x', hx + 12).attr('y', hy + 11).text(CITIES.seoul.sub);
}

fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json')
  .then(r => r.json())
  .then(topology => {
    countries = topojson.feature(topology, topology.objects.countries).features;
    draw();
  });

new ResizeObserver(() => draw()).observe(document.getElementById('wrap'));
</script>
</body>
</html>
